```ini
# ============================================================
# Loon Configuration
# Converted from:
# https://raw.githubusercontent.com/GITHUB-1220/VPN-Config/refs/heads/main/mihomo.yaml
# ============================================================


[General]

# 节点测速
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 5

# 网络检测
internet-test-url = http://wifi.vivo.com.cn/generate_204

# 自动选择模式
interface-mode = auto


# ============================================================
# Remote Proxy
# 节点订阅
# ============================================================

[Remote Proxy]

# 原 Mihomo:
# https://www.19981124.xyz/share/sub/sjc?token=sijiache20240305

节点订阅 = https://www.19981124.xyz/share/sub/sjc?token=sijiache20240305,parser-enabled=true,enabled=true


# ============================================================
# Remote Filter
# 从节点订阅中筛选不同地区节点
# ============================================================

[Remote Filter]

# Google：
# 仅香港节点

Google香港 = NameRegex,节点订阅,FilterKey = "(?i).*(香港|HK|Hong ?Kong).*"


# ChatGPT：
# 新加坡 / 日本 / 美国

ChatGPT节点 = NameRegex,节点订阅,FilterKey = "(?i).*(新加坡|Singapore|SG|日本|JP|Japan|美国|US|USA|United ?States).*"


# Telegram：
# 香港 / 新加坡 / IPLC

Telegram节点 = NameRegex,节点订阅,FilterKey = "(?i).*(香港|HK|Hong ?Kong|IPLC|新加坡|Singapore|SG).*"


# YouTube：
# 新加坡 / 日本 / 香港 / IPLC / 流媒体

YouTube节点 = NameRegex,节点订阅,FilterKey = "(?i).*(新加坡|Singapore|SG|日本|JP|Japan|香港|HK|Hong ?Kong|IPLC|流媒体).*"


# ============================================================
# Proxy Group
# ============================================================

[Proxy Group]


# ------------------------------------------------------------
# 全局节点选择
# ------------------------------------------------------------

🧭 节点选择 = select,🌍 全局自动,节点订阅


# ------------------------------------------------------------
# 全局自动测速
# ------------------------------------------------------------

🌍 全局自动 = url-test,节点订阅,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 100


# ------------------------------------------------------------
# Google
# ------------------------------------------------------------

🌐 Google = select,🌐 Google自动,🧭 节点选择

🌐 Google自动 = url-test,Google香港,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 100


# ------------------------------------------------------------
# ChatGPT / OpenAI
# ------------------------------------------------------------

🤖 ChatGPT = select,🤖 ChatGPT自动,🧭 节点选择

🤖 ChatGPT自动 = url-test,ChatGPT节点,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 100


# ------------------------------------------------------------
# Telegram
# ------------------------------------------------------------

📨 Telegram = select,📨 Telegram自动,🧭 节点选择

📨 Telegram自动 = url-test,Telegram节点,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 100


# ------------------------------------------------------------
# YouTube
# ------------------------------------------------------------

📺 YouTube = select,📺 YouTube自动,🧭 节点选择

📺 YouTube自动 = url-test,YouTube节点,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 100


# ------------------------------------------------------------
# 直连 / 拦截
# ------------------------------------------------------------

🟢 直连 = select,DIRECT

⛔ 拦截 = select,REJECT


# ============================================================
# Remote Rule
# ============================================================

[Remote Rule]


# ------------------------------------------------------------
# 局域网
# ------------------------------------------------------------

https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list,policy=🟢 直连,tag=Direct-LocalAreaNetwork,enabled=true


# ------------------------------------------------------------
# 国内域名
# ------------------------------------------------------------

https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt,policy=🟢 直连,tag=Direct,enabled=true


# ------------------------------------------------------------
# 国内 IP
# ------------------------------------------------------------

https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt,policy=🟢 直连,tag=Direct-CNCIDR,enabled=true


# ------------------------------------------------------------
# 私有域名
# ------------------------------------------------------------

https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt,policy=🟢 直连,tag=Direct-Private,enabled=true


# ------------------------------------------------------------
# 下载
# ------------------------------------------------------------

https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Download/Download.list,policy=🟢 直连,tag=Direct-Download,enabled=true


# ------------------------------------------------------------
# 游戏下载
# ------------------------------------------------------------

https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Game/GameDownload/GameDownload.list,policy=🟢 直连,tag=Direct-GameDownload,enabled=true


# ------------------------------------------------------------
# Steam 中国
# ------------------------------------------------------------

https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/SteamCN/SteamCN.list,policy=🟢 直连,tag=Direct-SteamCN,enabled=true


# ------------------------------------------------------------
# Binance
# ------------------------------------------------------------

https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Binance/Binance.list,policy=🟢 直连,tag=Direct-Binance,enabled=true


# ------------------------------------------------------------
# OKX
# ------------------------------------------------------------

https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OKX/OKX.list,policy=🟢 直连,tag=Direct-OKX,enabled=true


# ------------------------------------------------------------
# Google
# ------------------------------------------------------------

https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list,policy=🌐 Google,tag=Google,enabled=true


# ------------------------------------------------------------
# ChatGPT / OpenAI
# ------------------------------------------------------------

https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list,policy=🤖 ChatGPT,tag=ChatGPT,enabled=true


# ------------------------------------------------------------
# Telegram
# ------------------------------------------------------------

https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list,policy=📨 Telegram,tag=Telegram,enabled=true


# ------------------------------------------------------------
# YouTube
# ------------------------------------------------------------

https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list,policy=📺 YouTube,tag=YouTube,enabled=true


# ============================================================
# Rule
# 规则按照从上到下匹配
# ============================================================

[Rule]


# ------------------------------------------------------------
# 私有网络 / 局域网
# ------------------------------------------------------------

RULE-SET,Direct-LocalAreaNetwork,🟢 直连


# ------------------------------------------------------------
# 私有域名
# ------------------------------------------------------------

RULE-SET,Direct-Private,🟢 直连


# ------------------------------------------------------------
# 国内域名
# ------------------------------------------------------------

RULE-SET,Direct,🟢 直连


# ------------------------------------------------------------
# 国内 IP
# ------------------------------------------------------------

RULE-SET,Direct-CNCIDR,🟢 直连


# ------------------------------------------------------------
# 下载 / 游戏 / Steam
# ------------------------------------------------------------

RULE-SET,Direct-Download,🟢 直连

RULE-SET,Direct-GameDownload,🟢 直连

RULE-SET,Direct-SteamCN,🟢 直连


# ------------------------------------------------------------
# 加密货币
# ------------------------------------------------------------

RULE-SET,Direct-Binance,🟢 直连

RULE-SET,Direct-OKX,🟢 直连


# ------------------------------------------------------------
# Google
# ------------------------------------------------------------

RULE-SET,Google,🌐 Google


# ------------------------------------------------------------
# ChatGPT / OpenAI
# ------------------------------------------------------------

RULE-SET,ChatGPT,🤖 ChatGPT


# ------------------------------------------------------------
# Telegram
# ------------------------------------------------------------

RULE-SET,Telegram,📨 Telegram


# ------------------------------------------------------------
# YouTube
# ------------------------------------------------------------

RULE-SET,YouTube,📺 YouTube


# ------------------------------------------------------------
# 最终兜底
# ------------------------------------------------------------

FINAL,🧭 节点选择
