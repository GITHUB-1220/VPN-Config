# ============================================================
# Rules
# ============================================================

rules:

  # ==========================================================
  # 🟢 Private / LAN
  # ==========================================================

  - GEOSITE,private,🟢 直连

  - GEOIP,LAN,🟢 直连,no-resolve


  # ==========================================================
  # 🟢 局域网 Rule Provider
  # ==========================================================

  - RULE-SET,Direct-LocalAreaNetwork,🟢 直连


  # ==========================================================
  # 🇨🇳 中国大陆
  # ==========================================================

  - GEOSITE,CN,🟢 直连

  - GEOIP,CN,🟢 直连,no-resolve


  # ==========================================================
  # 🟢 Loyalsoldier Direct
  # ==========================================================

  - RULE-SET,Direct,🟢 直连

  - RULE-SET,Direct-CNCIDR,🟢 直连,no-resolve

  - RULE-SET,Direct-Private,🟢 直连


  # ==========================================================
  # 🎮 下载 / 游戏 / Steam
  # ==========================================================

  - RULE-SET,Direct-Download,🟢 直连

  - RULE-SET,Direct-GameDownload,🟢 直连

  - RULE-SET,Direct-SteamCN,🟢 直连


  # ==========================================================
  # 💰 加密货币
  # ==========================================================

  - RULE-SET,Direct-Binance,🟢 直连

  - RULE-SET,Direct-OKX,🟢 直连


  # ==========================================================
  # 🌐 Google
  # ==========================================================

  - RULE-SET,Google,🌐 Google


  # ==========================================================
  # 🤖 ChatGPT / OpenAI
  # ==========================================================

  - RULE-SET,ChatGPT,🤖 ChatGPT


  # ==========================================================
  # 📨 Telegram
  # ==========================================================

  - RULE-SET,Telegram,📨 Telegram


  # ==========================================================
  # 📺 YouTube
  # ==========================================================

  - RULE-SET,YouTube,📺 YouTube


  # ==========================================================
  # 🎯 FINAL
  # ==========================================================

  - MATCH,🧭 节点选择
