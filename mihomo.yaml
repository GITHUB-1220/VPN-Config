# Mihomo 订阅模板
# 将下面的 <SUBSCRIPTION_URL> 替换成你的机场/节点订阅地址。
# Mihomo 会定期拉取订阅，并由下面的策略组自动选取节点。
#
# 如果订阅返回的是标准 Clash/Mihomo 节点列表，可直接使用。
# interval 单位：秒。

mixed-port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090

proxy-providers:
  节点订阅:
    type: http
    url: "https://www.19981124.xyz/share/sub/sjc?token=sijiache20240305"
    path: ./proxy_providers/sub.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000

proxies: []

proxy-groups:
  - name: 🧭 节点选择
    type: select
    use:
      - 节点订阅
    proxies:
      - 🌍 全局自动

  - name: 🌍 全局自动
    type: url-test
    use:
      - 节点订阅
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 100

  - name: 🌐 Google
    type: select
    proxies:
      - 🌐 Google自动
      - 🧭 节点选择

  - name: 🌐 Google自动
    type: url-test
    use:
      - 节点订阅
    filter: '^(?=.*(JP|日本|SG|新加坡)).*$'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 100

  - name: 🤖 ChatGPT
    type: select
    proxies:
      - 🤖 ChatGPT自动
      - 🧭 节点选择

  - name: 🤖 ChatGPT自动
    type: url-test
    use:
      - 节点订阅
    filter: '^(?=.*(JP|日本|SG|新加坡|US|美国)).*$'
    url: https://api.openai.com/v1/models
    interval: 300
    tolerance: 100

  - name: 📨 Telegram
    type: select
    proxies:
      - 📨 Telegram自动
      - 🧭 节点选择

  - name: 📨 Telegram自动
    type: url-test
    use:
      - 节点订阅
    filter: '^(?=.*(HK|香港|SG|新加坡)).*$'
    url: https://cachefly.cachefly.net/10mb.test
    interval: 300
    tolerance: 100

  - name: 📺 YouTube
    type: select
    proxies:
      - 📺 YouTube自动
      - 🧭 节点选择

  - name: 📺 YouTube自动
    type: url-test
    use:
      - 节点订阅
    filter: '^(?=.*(HK|香港|JP|日本|SG|新加坡)).*$'
    url: https://cachefly.cachefly.net/10mb.test
    interval: 300
    tolerance: 100

  - name: 🟢 直连
    type: select
    proxies:
      - DIRECT

  - name: ⛔ 拦截
    type: select
    proxies:
      - REJECT

