# ============================================================
# Mihomo 配置
# ============================================================

# 基础设置
mixed-port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090

# ============================================================
# 节点订阅
# 每 30 分钟更新一次
# ============================================================

proxy-providers:
  节点订阅:
    type: http
    url: "https://www.19981124.xyz/share/sub/sjc?token=sijiache20240305"
    path: ./proxy_providers/sub.yaml
    interval: 1800

    # 每 5 分钟检查节点状态
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000

proxies: []

# ============================================================
# 策略组
# ============================================================

proxy-groups:

  # 手动选择节点
  - name: 🧭 节点选择
    type: select
    use:
      - 节点订阅
    proxies:
      - 🌍 全局自动

  # 全部节点自动测速
  - name: 🌍 全局自动
    type: url-test
    use:
      - 节点订阅
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 100

  # ==========================================================
  # Google
  # ==========================================================

  # Google 手动选择 / 自动选择
  - name: 🌐 Google
    type: select
    proxies:
      - 🌐 Google自动
      - 🧭 节点选择

  # Google 自动测速
  # 仅筛选香港节点
  - name: 🌐 Google自动
    type: url-test
    use:
      - 节点订阅
    filter: '(?i).*(香港|HK|Hong ?Kong).*'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 100

  # ==========================================================
  # ChatGPT / OpenAI
  # ==========================================================

  # ChatGPT 手动选择 / 自动选择
  - name: 🤖 ChatGPT
    type: select
    proxies:
      - 🤖 ChatGPT自动
      - 🧭 节点选择

  # ChatGPT 自动测速
  # 新加坡 / 日本 / 美国节点
  - name: 🤖 ChatGPT自动
    type: url-test
    use:
      - 节点订阅
    filter: '(?i).*(新加坡|Singapore|SG|日本|JP|Japan|美国|US|USA|United ?States).*'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 100

  # ==========================================================
  # Telegram
  # ==========================================================

  # Telegram 手动选择 / 自动选择
  - name: 📨 Telegram
    type: select
    proxies:
      - 📨 Telegram自动
      - 🧭 节点选择

  # Telegram 自动测速
  # 香港 / 新加坡 / IPLC 节点
  - name: 📨 Telegram自动
    type: url-test
    use:
      - 节点订阅
    filter: '(?i).*(香港|HK|Hong ?Kong|IPLC|新加坡|Singapore|SG).*'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 100

  # ==========================================================
  # YouTube
  # ==========================================================

  # YouTube 手动选择 / 自动选择
  - name: 📺 YouTube
    type: select
    proxies:
      - 📺 YouTube自动
      - 🧭 节点选择

  # YouTube 自动测速
  # 香港 / 日本 / 新加坡 / IPLC / 流媒体节点
  - name: 📺 YouTube自动
    type: url-test
    use:
      - 节点订阅
    filter: '(?i).*(新加坡|Singapore|SG|日本|JP|Japan|香港|HK|Hong ?Kong|IPLC|流媒体).*'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 100

  # ==========================================================
  # 直连 / 拦截
  # ==========================================================

  # 强制直连
  - name: 🟢 直连
    type: select
    proxies:
      - DIRECT

  # 强制拦截
  - name: ⛔ 拦截
    type: select
    proxies:
      - REJECT

# ============================================================
# Rule Providers
# 所有远程规则每 30 分钟更新
# ============================================================

rule-providers:

  # ----------------------------------------------------------
  # 局域网
  # ACL4SSR / classical + text
  # ----------------------------------------------------------

  Direct-LocalAreaNetwork:
    type: http
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list"
    path: ./rule-providers/Direct-LocalAreaNetwork.list
    interval: 1800
    behavior: classical
    format: text

  # ----------------------------------------------------------
  # 国内域名
  # Loyalsoldier / domain + yaml
  # ----------------------------------------------------------

  Direct:
    type: http
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"
    path: ./rule-providers/Direct.yaml
    interval: 1800
    behavior: domain
    format: yaml

