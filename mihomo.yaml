# ============================================================
# Mihomo 完整配置
# ============================================================

mixed-port: 7890
socks-port: 7891

allow-lan: true

mode: Rule

log-level: info

external-controller: 127.0.0.1:9090


# ============================================================
# 节点订阅
# ============================================================

proxy-providers:

  节点订阅:
    type: http
    url: "https://www.19981124.xyz/share/sub/sjc?token=sijiache20240305"
    path: ./proxy_providers/sub.yaml
    interval: 86400

    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000


# ============================================================
# 代理节点
# ============================================================

proxies: []


# ============================================================
# 策略组
# ============================================================

proxy-groups:

  # ==========================================================
  # 🧭 节点选择
  # ==========================================================

  - name: 🧭 节点选择
    type: select

    use:
      - 节点订阅

    proxies:
      - 🌍 全局自动


  # ==========================================================
  # 🌍 全局自动
  # ==========================================================

  - name: 🌍 全局自动
    type: url-test

    use:
      - 节点订阅

    url: https://cp.cloudflare.com/generate_204

    interval: 300

    tolerance: 100


  # ==========================================================
  # 🌐 Google
  # ==========================================================

  - name: 🌐 Google
    type: select

    proxies:
      - 🌐 Google自动
      - 🧭 节点选择


  - name: 🌐 Google自动
    type: url-test

    use:
      - 节点订阅

    filter: '(?i).*(新加坡|Singapore|SG|日本|JP|Japan).*'

    url: https://cp.cloudflare.com/generate_204

    interval: 300

    tolerance: 100


  # ==========================================================
  # 🤖 ChatGPT / OpenAI
  # ==========================================================

  - name: 🤖 ChatGPT
    type: select

    proxies:
      - 🤖 ChatGPT自动
      - 🧭 节点选择


  - name: 🤖 ChatGPT自动
    type: url-test

    use:
      - 节点订阅

    filter: '(?i).*(新加坡|Singapore|SG|日本|JP|Japan|美国|US|USA|United ?States).*'

    url: https://api.openai.com/v1/models

    interval: 300

    tolerance: 100


  # ==========================================================
  # 📨 Telegram
  # ==========================================================

  - name: 📨 Telegram
    type: select

    proxies:
      - 📨 Telegram自动
      - 🧭 节点选择


  - name: 📨 Telegram自动
    type: url-test

    use:
      - 节点订阅

    filter: '(?i).*(香港|HK|Hong ?Kong|IPLC|新加坡|Singapore|SG).*'

    url: https://cachefly.cachefly.net/10mb.test

    interval: 300

    tolerance: 100


  # ==========================================================
  # 📺 YouTube
  # ==========================================================

  - name: 📺 YouTube
    type: select

    proxies:
      - 📺 YouTube自动
      - 🧭 节点选择


  - name: 📺 YouTube自动
    type: url-test

    use:
      - 节点订阅

    filter: '(?i).*(新加坡|Singapore|SG|日本|JP|Japan|香港|HK|Hong ?Kong|IPLC|流媒体).*'

    url: https://cachefly.cachefly.net/10mb.test

    interval: 300

    tolerance: 100


  # ==========================================================
  # 🟢 直连
  # ==========================================================

  - name: 🟢 直连
    type: select

    proxies:
      - DIRECT


  # ==========================================================
  # ⛔ 拦截
  # ==========================================================

  - name: ⛔ 拦截
    type: select

    proxies:
      - REJECT


# ============================================================
# Rule Providers
# ============================================================

rule-providers:

  # ==========================================================
  # 🟢 局域网
  #
  # ACL4SSR LocalAreaNetwork.list
  # 属于 classical + text
  # ==========================================================

  Direct-LocalAreaNetwork:

    type: http

    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list"

    path: ./rule-providers/Direct-LocalAreaNetwork.list

    interval: 86400

    behavior: classical

    format: text


  # ==========================================================
  # 🟢 Loyalsoldier Direct
  #
  # direct.txt:
  # domain 类型
  # YAML 格式
  # ==========================================================

  Direct:

    type: http

    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"

    path: ./rule-providers/Direct.yaml

    interval: 86400

    behavior: domain

    format: yaml


  # ==========================================================
  # 🟢 Loyalsoldier CN CIDR
